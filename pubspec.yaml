name: camerasync
description: camerasync ” --org com.camerasync”
version: 1.0.6+26
publish_to: none

environment:
  sdk: ">=3.3.4 <4.0.0"
  flutter: 3.32.7

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  dartz: ^0.10.1
  internet_connection_checker_plus: ^2.7.2
  flutter_easyloading: ^3.0.5
  get_it: ^8.2.0
  injectable: ^2.5.1
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7
  flutter_svg: ^2.2.0
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  easy_localization: ^3.0.8
  cached_network_image: ^3.4.1
  pretty_dio_logger: ^1.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  http: ^1.2.1
  camera: ^0.11.0+2
  flutter_background: ^1.3.0+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator:
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

dependency_overrides:
  modal_bottom_sheet:
    git:
      url: https://github.com/followthemoney1/modal_bottom_sheet.git
      ref: main
      path: modal_bottom_sheet

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
